<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi - SPADA</title>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --text: #f1f5f9; --text2: #94a3b8; --accent: #38bdf8; --green: #22c55e; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .nav { background: var(--surface); padding: 12px 16px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--surface2); }
        .nav-brand { font-weight: 700; font-size: 18px; color: var(--accent); }
        .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
        .nav-links a { color: var(--text2); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; }
        .nav-links a:hover, .nav-links a.active { background: var(--surface2); color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
        .log-card { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; }
        .log-card .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .log-card .header h3 { font-size: 14px; }
        .log-card .meta { font-size: 12px; color: var(--text2); }
        .empty { text-align: center; color: var(--text2); padding: 40px 20px; }
        @media (max-width: 600px) { .nav { flex-direction: column; align-items: flex-start; gap: 8px; } .nav-links a { font-size: 12px; padding: 4px 8px; } }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">SPADA</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/jadwal">Jadwal</a>
            <a href="/tugas">Tugas</a>
            <a href="/nilai">Nilai</a>
            <a href="/absensi" class="active">Absensi</a>
        </div>
    </nav>
    <div class="container">
        {% if submissions %}
            {% for s in submissions|reverse %}
            <div class="log-card">
                <div class="header">
                    <h3>{{ s.title }}</h3>
                    <span style="color:var(--green);font-size:12px;font-weight:600;">✓ Terkirim</span>
                </div>
                <div class="meta">{{ s.course }} • {{ s.submitted_at[:10] if s.submitted_at else "—" }}</div>
            </div>
            {% endfor %}
        {% else %}
            <div class="empty">Belum ada riwayat absensi/pengumpulan.</div>
        {% endif %}
    </div>
</body>
</html>
