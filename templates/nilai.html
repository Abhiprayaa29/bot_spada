<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilai - SPADA</title>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --text: #f1f5f9; --text2: #94a3b8; --accent: #38bdf8; --green: #22c55e; --radius: 12px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .nav { background: var(--surface); padding: 12px 16px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--surface2); }
        .nav-brand { font-weight: 700; font-size: 18px; color: var(--accent); }
        .nav-links { display: flex; gap: 4px; flex-wrap: wrap; }
        .nav-links a { color: var(--text2); text-decoration: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; }
        .nav-links a:hover, .nav-links a.active { background: var(--surface2); color: var(--text); }
        .container { max-width: 800px; margin: 0 auto; padding: 20px 16px; }
        table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: 12px; overflow: hidden; }
        th { text-align: left; padding: 12px 16px; color: var(--text2); font-weight: 500; font-size: 13px; border-bottom: 1px solid var(--surface2); }
        td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .grade { font-weight: 700; color: var(--green); }
        .empty { text-align: center; color: var(--text2); padding: 40px 20px; background: var(--surface); border-radius: 12px; }
        @media (max-width: 600px) { .nav { flex-direction: column; align-items: flex-start; gap: 8px; } .nav-links a { font-size: 12px; padding: 4px 8px; } th, td { padding: 8px 12px; font-size: 13px; } }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">SPADA</div>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/jadwal">Jadwal</a>
            <a href="/tugas">Tugas</a>
            <a href="/nilai" class="active">Nilai</a>
            <a href="/absensi">Absensi</a>
        </div>
    </nav>
    <div class="container">
        {% if grades %}
        <table>
            <thead>
                <tr><th>Mata Kuliah</th><th>Nilai</th></tr>
            </thead>
            <tbody>
                {% for g in grades %}
                <tr>
                    <td>{{ g.course }}</td>
                    <td class="grade">{{ g.grade or "—" }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
            <div class="empty">Belum ada nilai terdeteksi.</div>
        {% endif %}
    </div>
</body>
</html>
